name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundaries:
    name: Dependency boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check-deps.sh

  contracts:
    name: Contracts lint and breaking check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          input: contracts
          lint: true
          format: false
          # Compare against main; skipped automatically on pushes to main.
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: "${{ github.event.repository.clone_url }}#branch=main,subdir=contracts"
          push: false
          # The job has read-only permissions, so it cannot post PR comments.
          pr_comment: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: contracts/ts/package-lock.json
      - name: Install TypeScript contract dependencies
        run: npm ci
        working-directory: contracts/ts
      - name: Generate TypeScript contract types
        run: npm run generate
        working-directory: contracts/ts
      - name: Fail if generated code is stale
        # `git status` also catches new, uncommitted generated files, which
        # `git diff` alone would miss.
        run: |
          changes="$(git status --porcelain -- contracts/ts/src/gen)"
          if [ -n "$changes" ]; then
            echo "Generated TypeScript is stale. Run 'npm run generate' in contracts/ts and commit:"
            echo "$changes"
            exit 1
          fi
      - name: Type-check TypeScript contract types
        run: npm run check
        working-directory: contracts/ts

  rust:
    name: Rust build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p tt-renderer --target wasm32-unknown-unknown

  web:
    name: Web check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # web/ has no app until the UI shell is merged. Until then every step
      # below is skipped and the job passes.
      - name: Is the web app present?
        id: app
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "web/package.json not found; skipping the web checks."
          fi
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        if: steps.app.outputs.present == 'true'
        run: npm ci
        working-directory: web
      - name: Type-check
        if: steps.app.outputs.present == 'true'
        run: npm run check
        working-directory: web
      - name: Unit tests
        if: steps.app.outputs.present == 'true'
        run: npm test
        working-directory: web
      - name: Build
        if: steps.app.outputs.present == 'true'
        run: npm run build
        working-directory: web
