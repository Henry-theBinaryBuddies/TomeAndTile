syntax = "proto3";

package tomeandtile.v1;

// Video and voice (ADR 0007). Media goes through an SFU (LiveKit). The game
// server's only job is to hand campaign members a short-lived join token;
// it relays no media and no signalling.

// Client -> server: ask to join this campaign's call.
message MediaTokenRequest {}

// Server -> client: reply to MediaTokenRequest. Sent only to members of the
// campaign. The token is a credential: never log it or store it.
message MediaToken {
  // WebSocket URL of the SFU, e.g. "wss://example.livekit.cloud".
  string sfu_url = 1;
  // Signed join token scoped to one room and one user.
  string token = 2;
  // Room name; one room per campaign.
  string room = 3;
  // Unix milliseconds after which the token is refused. Ask again to rejoin.
  int64 expires_at_ms = 4;
  // False for spectators: they may watch and listen but not publish.
  bool can_publish = 5;
}
