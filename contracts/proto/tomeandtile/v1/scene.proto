syntax = "proto3";

package tomeandtile.v1;

import "tomeandtile/v1/common.proto";

enum GridKind {
  GRID_KIND_UNSPECIFIED = 0;
  GRID_KIND_SQUARE = 1;
  GRID_KIND_HEX_ROWS = 2;
  GRID_KIND_HEX_COLUMNS = 3;
  GRID_KIND_NONE = 4;
}

// How diagonal movement is counted on a square grid.
enum DiagonalRule {
  DIAGONAL_RULE_UNSPECIFIED = 0;
  // Every diagonal costs 5 ft.
  DIAGONAL_RULE_FIVE = 1;
  // Diagonals alternate 5 ft and 10 ft.
  DIAGONAL_RULE_FIVE_TEN = 2;
  // True Euclidean distance.
  DIAGONAL_RULE_EUCLIDEAN = 3;
}

message Grid {
  GridKind kind = 1;
  // Size of one cell in scene units (pixels of the source map image).
  float cell_size = 2;
  // Offset of the grid origin from the map's top-left, for manual alignment.
  Vec2 offset = 3;
  // Feet represented by one cell. 5 for standard 5e.
  float feet_per_cell = 4;
  DiagonalRule diagonal_rule = 5;
}

// A reference to an uploaded file in object storage. The bytes are never
// sent over the game socket.
message AssetRef {
  string asset_id = 1;
  // "image/png", "image/webp", "video/webm", ...
  string media_type = 2;
  string url = 3;
  uint32 width = 4;
  uint32 height = 5;
}

// One floor of a scene. Single-level maps have exactly one.
message Level {
  string level_id = 1;
  string name = 2;
  // Height of this floor above the scene's ground, in feet.
  float elevation_feet = 3;
  AssetRef background = 4;
}

enum WallKind {
  WALL_KIND_UNSPECIFIED = 0;
  WALL_KIND_WALL = 1;
  WALL_KIND_DOOR = 2;
  WALL_KIND_WINDOW = 3;
  // Blocks movement but not sight (a low wall, a pit edge).
  WALL_KIND_TERRAIN = 4;
}

// A line segment that blocks movement, sight or both. Built after the class;
// defined now so map importers have somewhere to put wall data.
message Wall {
  string wall_id = 1;
  string level_id = 2;
  Vec2 a = 3;
  Vec2 b = 4;
  WallKind kind = 5;
  // Doors only.
  bool open = 6;
}

message Scene {
  string scene_id = 1;
  string campaign_id = 2;
  string name = 3;
  Grid grid = 4;
  repeated Level levels = 5;
  repeated Wall walls = 6;
}

enum CreatureSize {
  CREATURE_SIZE_UNSPECIFIED = 0;
  CREATURE_SIZE_TINY = 1;
  CREATURE_SIZE_SMALL = 2;
  CREATURE_SIZE_MEDIUM = 3;
  CREATURE_SIZE_LARGE = 4;
  CREATURE_SIZE_HUGE = 5;
  CREATURE_SIZE_GARGANTUAN = 6;
}

// What a viewer who does not control the token sees of its health.
//
// The server computes it from the token's hp_current and hp_max after every
// HP change, in integer arithmetic. Temporary HP does not count.
//   HEALTH_STATE_DOWN        hp_current is 0
//   HEALTH_STATE_NEAR_DEATH  hp_current * 4 <= hp_max (at or below a quarter)
//   HEALTH_STATE_BLOODIED    hp_current * 2 <= hp_max (at or below half)
//   HEALTH_STATE_HEALTHY     above half
// A token with no hp_max, or hp_max 0, keeps the state it has.
// Example, hp_max 9: 5 to 9 Healthy, 3 and 4 Bloodied, 1 and 2 Near death,
// 0 Down.
//
// health_state goes to every viewer who receives the token; the numbers only
// to the GM and controllers (ADR 0006). Reaching 0 sets Down and nothing
// else: death saves are rolled by hand (ADR 0005).
enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_HEALTHY = 1;
  HEALTH_STATE_BLOODIED = 2;
  HEALTH_STATE_NEAR_DEATH = 3;
  HEALTH_STATE_DOWN = 4;
}

message Aura {
  string label = 1;
  float radius_feet = 2;
  // CSS colour string.
  string color = 3;
}

// When a timed condition on a token ends. A condition with no timer stays
// until it is removed. Only round-based durations get a timer, and only
// while an encounter is running on the token's scene.
//
// Rules, applied in round R of a running encounter, from the ability's
// ApplyEffectStep.duration:
//   DURATION_UNIT_ROUNDS, amount N                 ends_round R + N, at the
//                                                  start of the source's turn
//   DURATION_UNIT_UNTIL_START_OF_SOURCE_NEXT_TURN  ends_round R + 1, at the
//                                                  start
//   DURATION_UNIT_UNTIL_END_OF_SOURCE_NEXT_TURN    ends_round R + 1, at the
//                                                  end
// If the source is not a combatant, the timer ends at the start of
// ends_round (when the turn order wraps).
// MINUTES, HOURS, UNTIL_DISPELLED, INSTANT, UNSPECIFIED, and any round-based
// duration outside an encounter: no timer, and the warning
// duration_not_tracked (except INSTANT and UNSPECIFIED, which give no
// warning). Duration.concentration is ignored in M3.
// Ending an encounter removes its timers and leaves the conditions on the
// tokens.
// A non-GM viewer receives source_token_id "" when the source token is
// hidden or no longer exists, and encounter_id "" when they cannot see that
// encounter (it has a hidden combatant) or it no longer exists; ends_round
// and at_end_of_turn are always sent (#133). Treat "" as "unknown".
message ConditionTimer {
  string effect_id = 1;
  string encounter_id = 2;
  // The token whose turn ends the condition (the ability's source).
  string source_token_id = 3;
  // The encounter round in which it ends.
  uint32 ends_round = 4;
  // False: at the start of the source's turn in ends_round. True: at the end.
  bool at_end_of_turn = 5;
}

// A token as sent to one viewer. Fields the viewer may not see are left
// unset by the server (ADR 0006); clients must treat unset as "unknown".
message Token {
  string token_id = 1;
  string scene_id = 2;
  string level_id = 3;
  // The creature this token represents. Unset for props.
  string creature_id = 4;
  string name = 5;
  AssetRef image = 6;
  Vec2 position = 7;
  CreatureSize size = 8;
  // Degrees clockwise from north.
  float facing_degrees = 9;
  // Height above the level's floor, for flying creatures.
  float elevation_feet = 10;
  repeated Aura auras = 11;
  // Always present.
  HealthState health_state = 12;
  // Present only for controllers, the GM, or when revealed.
  //
  // hp_current, hp_max, hp_temp, conditions and condition_timers are the live
  // values. Damage, healing, SetHitPointsIntent and SetConditionsIntent change
  // the token only. Several tokens can share one creature (three goblins, one
  // stat block), so the creature cannot hold live HP. The HP values are copied
  // from the creature when the token is created (CreateTokenIntent). A token
  // with no hp_max has no HP to change: damage and healing are shown on the
  // result card but not applied (warning no_hit_points).
  optional int32 hp_current = 13;
  optional int32 hp_max = 14;
  optional int32 hp_temp = 15;
  // Condition ids. The SRD conditions are: blinded, charmed, deafened,
  // exhaustion, frightened, grappled, incapacitated, invisible, paralyzed,
  // petrified, poisoned, prone, restrained, stunned, unconscious. Any other id
  // matching [a-z0-9_]{1,40} (bless, hunters_mark, shield) is a label: shown,
  // stored and timed, with no rules effect.
  repeated string conditions = 16;
  // User ids allowed to move and act with this token (control handover).
  repeated string controller_user_ids = 17;
  // Hidden tokens are sent only to the GM.
  bool hidden = 18;
  // When the timed entries of `conditions` end (see ConditionTimer). Filtered
  // like `conditions`: sent to everyone who receives the token.
  repeated ConditionTimer condition_timers = 19;
}
