syntax = "proto3";

package tomeandtile.v1;

// Identifiers are opaque strings minted by the server (UUIDv7 text form).
// Clients never invent an id for a server-owned object.

// A point or offset in scene units. One grid cell is `Grid.cell_size` units.
message Vec2 {
  float x = 1;
  float y = 2;
}

// Campaign role. Open enum: new roles may be appended.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_GM = 1;
  ROLE_PLAYER = 2;
  ROLE_SPECTATOR = 3;
}

// The six ability scores.
enum AbilityScore {
  ABILITY_SCORE_UNSPECIFIED = 0;
  ABILITY_SCORE_STRENGTH = 1;
  ABILITY_SCORE_DEXTERITY = 2;
  ABILITY_SCORE_CONSTITUTION = 3;
  ABILITY_SCORE_INTELLIGENCE = 4;
  ABILITY_SCORE_WISDOM = 5;
  ABILITY_SCORE_CHARISMA = 6;
}

// Which edition's rules a piece of content was written for.
enum RulesEdition {
  RULES_EDITION_UNSPECIFIED = 0;
  RULES_EDITION_2014 = 1;
  RULES_EDITION_2024 = 2;
}

// Where a piece of content came from. Required on all game content so the
// SRD-only rule (ADR 0009) can be checked.
message Provenance {
  // "srd-5.1", "srd-5.2", "creature-cauldron", "adventurers-anvil", "user".
  string source = 1;
  // Free text shown in the UI, e.g. the attribution line for SRD content.
  string attribution = 2;
  // The id this content has in the system it came from (for example a
  // Creature Cauldron monster id), so a re-import can be matched to the
  // earlier one. Never used as a Tome & Tile id.
  string external_id = 3;
  // The source system's own notes on where the content came from: its
  // category ("srd", "ai", "reskin"), parent, generator, list of changes.
  // Free text for display. Licence text goes in `attribution`, verbatim.
  string origin_notes = 4;
}

// A non-fatal note attached to an event: "out of range", "no spell slot".
// The engine warns and never blocks (ADR 0005).
message Warning {
  // Stable machine code, e.g. "out_of_range". The codes for UseAbilityIntent
  // (also listed on that message in session.proto):
  //   out_of_range           a target is beyond long range, or beyond
  //                          range_feet when there is no long range; the attack
  //                          is still rolled
  //   too_many_targets       an ability with one attack step lists more targets
  //                          than max_targets; every target is still resolved
  //   not_enough_resource    resource_key names a resource the creature lacks,
  //                          or it has too few uses; the ability still resolves
  //   extra_targets_ignored  an ability with several attack steps lists more
  //                          targets than it has attack steps; the extra
  //                          entries are ignored
  //   area_not_checked       an area shape (SPHERE, CONE, LINE, CUBE): the
  //                          listed tokens are the targets; no template is
  //                          placed or checked. Given once per use
  //   no_hit_points          a target token has no hp_max; damage or healing
  //                          is shown, not applied
  //   condition_immune       an effect was not applied because the target's
  //                          creature is immune (UseAbilityIntent), or an
  //                          added condition id is in the creature's
  //                          condition_immunities and was added anyway
  //                          (SetConditionsIntent)
  //   too_many_conditions    a target token already had 32 conditions, so an
  //                          effect could not be added (once per token)
  //   duration_not_tracked   an effect's duration gets no timer (see
  //                          ConditionTimer in scene.proto); the condition is
  //                          still applied
  //   ability_recharging     the ability's recharge_spent was already true;
  //                          it still resolves
  string code = 1;
  // Human-readable text.
  string message = 2;
}
