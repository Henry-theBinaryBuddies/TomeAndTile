<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tome &amp; Tile renderer demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1a1f; color: #ddd; font: 14px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #status { padding: 6px 10px; font-family: ui-monospace, monospace; white-space: pre-wrap; }
    #status .bad { color: #f0907a; }
    /* The renderer owns the pixels; the page owns the layout. A fixed CSS size
       (not "auto") keeps resize() from feeding back into layout. touch-action
       lets pointer events through for dragging. */
    #stage { flex: 1; min-height: 0; position: relative; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  </style>
</head>
<body>
  <div id="status">starting...</div>
  <div id="stage"><canvas id="map"></canvas></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
