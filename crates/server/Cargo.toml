[package]
name = "tt-server"
description = "Authoritative game server: sessions, permissions, event log, filtering."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "tt_server"
path = "src/lib.rs"

[[bin]]
name = "tt-server"
path = "src/main.rs"

[dependencies]
tt-contracts = { path = "../../contracts/rust" }
tt-rules = { path = "../rules" }
prost = "0.14.6"
serde_json = "1"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
getrandom = "0.3"
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "test-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
