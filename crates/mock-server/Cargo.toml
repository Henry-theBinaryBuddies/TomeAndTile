[package]
name = "tt-mock-server"
description = "Recorded-data stand-in for the game server: speaks the real socket protocol, applies no rules."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "tt_mock_server"
path = "src/lib.rs"

[[bin]]
name = "tt-mock-server"
path = "src/main.rs"

[dependencies]
tt-contracts = { path = "../../contracts/rust" }
prost = "0.14.6"
serde_json = "1"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
